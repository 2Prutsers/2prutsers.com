<svg width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">App icon for Video Debriefs, version 11</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A rounded-square macOS app icon with an ocean gradient and a viewfinder frame of four white corner brackets. Two large Jet Fin style fins, scaled up and angled about thirty degrees downward to the right, dominate the icon. The legs run diagonally out of the top left of the icon. The far fin passes behind the frame brackets while the near fin and leg cross in front of them, blades reaching past the frame lines toward the bottom right. Thin dark keylines separate the white shapes, and small bubbles rise around them.</desc>
<defs>
<linearGradient id="ocean11" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0a3550"/>
<stop offset="100%" stop-color="#12879a"/>
</linearGradient>
<clipPath id="squircle11">
<rect x="0" y="0" width="680" height="680" rx="150" ry="150"/>
</clipPath>
</defs>

